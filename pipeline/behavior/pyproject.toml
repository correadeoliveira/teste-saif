[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behavior-pipeline"
version = "0.1.0"
description = "SAIFEN — IMU behavior pipeline (JSONL → features → Logistic Regression → model.json)"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0,<1.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.scripts]
behavior-pipeline = "behavior_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["behavior_pipeline*"]
exclude = ["tests*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore:divide by zero encountered in matmul:RuntimeWarning",
    "ignore:overflow encountered in matmul:RuntimeWarning",
    "ignore:invalid value encountered in matmul:RuntimeWarning",
]
