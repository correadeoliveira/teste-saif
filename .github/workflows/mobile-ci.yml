name: mobile · ci

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests (zone, crimes, profile)
        run: npm test

      - name: Inference parity (Python fixture)
        run: npm run test:parity

      - name: Lint
        run: npm run lint

      - name: Expo doctor
        continue-on-error: true
        run: npx expo-doctor
