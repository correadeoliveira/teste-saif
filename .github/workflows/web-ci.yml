name: web · ci

on:
  push:
    paths: &paths
      - "src/**"
      - "web/**"
      - "tools/**"
      - "shared/web/**"
      - "shared/heatmaps/**"
      - "shared/current_run.json"
      - "shared/summary.json"
      - "vite.config.ts"
      - "index.html"
      - "postcss.config.mjs"
      - "package*.json"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

jobs:
  test:
    # Playwright 1.60 provides browser dependencies for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate standalone HTML and imports
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tidy
          status=0
          tidy -utf8 -errors -q --new-blocklevel-tags "header,aside,footer" web/index.html || status=$?
          test "$status" -lt 2
          node tools/check-web-imports.mjs
      - run: npm test
      - run: npm run build
      - name: Smoke test both web clients
        run: |
          pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
          python web/test/smoke.py
