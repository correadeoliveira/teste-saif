name: behavior · ci

on:
  push:
    paths: &paths
      - "pipeline/behavior/**"
      - "shared/behavior/**"
      - "shared/schema/behavior_model.schema.json"
      - "mobile/assets/behavior/model.json"
      - "tools/pipeline-summary.py"
      - ".github/workflows/behavior-ci.yml"
  pull_request:
    paths: *paths

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline/behavior
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[test]"
      - name: Ruff
        run: |
          pip install ruff
          ruff check --select E,F .
      - name: Pytest
        run: pytest -q

      - name: Reproduce synthetic training and metrics
        run: |
          python -m behavior_pipeline generate-demo
          python -m behavior_pipeline train
          python -m behavior_pipeline evaluate
          python -m behavior_pipeline export-model
          python ../../tools/pipeline-summary.py behavior >> "$GITHUB_STEP_SUMMARY"
