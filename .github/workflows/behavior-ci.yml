name: behavior · ci

on:
  push:
    paths:
      - "pipeline/behavior/**"
      - "shared/behavior/**"
      - ".github/workflows/behavior-ci.yml"
  pull_request:
    paths:
      - "pipeline/behavior/**"
      - "shared/behavior/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline/behavior
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[test]"
      - name: Ruff
        run: |
          pip install ruff
          ruff check --select E,F .
      - name: Pytest
        run: pytest -q
