name: pipeline · build heatmaps

# Reprocessa heatmaps quando uma nova planilha entra em data/raw/
# ou o pipeline Python é atualizado. Commita os artefatos de volta
# no repositório (shared/*), prontos para o web e o mobile.
#
# Sem execucao agendada. O cron semanal (0 6 * * 1) rodava o pipeline toda
# segunda e o saifen-bot committava shared/ em cima do horario, mesmo sem
# dado novo. O rebuild continua pelo push em data/raw/**.xlsx ou pipeline/**,
# e por execucao manual (workflow_dispatch) na aba Actions.

on:
  push:
    branches: [main]
    paths:
      - "data/raw/**.xlsx"
      - "pipeline/**"
      - ".github/workflows/pipeline.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov jsonschema ruff

      - name: Tests before train
        run: pytest -q

  build-heatmaps:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: python scripts/run_pipeline.py --force

      - name: Commit generated artifacts
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name  "saifen-bot"
          git config user.email "saifen-bot@users.noreply.github.com"
          git add shared/
          if git diff --staged --quiet; then
            echo "Nenhuma mudança nos heatmaps."
          else
            git commit -m "chore(shared): rebuild heatmaps $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shared-${{ github.sha }}
          path: shared/
          retention-days: 30
