name: supabase · ci

# Sem Docker/PostGIS neste ciclo: o contrato das RPCs é checado no SQL
# versionado (device_id, clamp de raio, limiares = zone.ts).

on:
  push:
    paths:
      - "supabase/**"
      - "mobile/src/services/zone.ts"
      - ".github/workflows/supabase-ci.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "mobile/src/services/zone.ts"

jobs:
  sql-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static RPC contract
        run: python3 supabase/tests/check_sql.py
